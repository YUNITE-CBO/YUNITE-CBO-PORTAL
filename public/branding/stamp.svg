<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 110" role="img" aria-label="Certified by Yunite Pamoja CBO">
  <defs>
    <radialGradient id="ypStampFill" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#E8FFF0" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.0"/>
    </radialGradient>
  </defs>
  <g transform="translate(6,6)">
    <!-- Outer double ring -->
    <circle cx="49" cy="49" r="43" fill="url(#ypStampFill)" stroke="#0B2A4A" stroke-width="3"/>
    <circle cx="49" cy="49" r="36" fill="none" stroke="#0B2A4A" stroke-width="1.4" stroke-dasharray="3 2.5"/>
    <!-- Inner seal disc -->
    <circle cx="49" cy="49" r="24" fill="none" stroke="#22C55E" stroke-width="2"/>
    <!-- Checkmark -->
    <path d="M37 49 l8 9 l16 -20" fill="none" stroke="#22C55E" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Curved top text -->
    <path id="ypStampTopArc" d="M49 6 a43 43 0 0 1 0 86" fill="none"/>
    <path id="ypStampBotArc" d="M49 92 a43 43 0 0 1 0 -86" fill="none"/>
    <text font-family="Georgia, 'Times New Roman', serif" font-size="9.5" font-weight="700" letter-spacing="2.4" fill="#0B2A4A">
      <textPath href="#ypStampTopArc" startOffset="50%" text-anchor="middle">YUNITE PAMOJA CBO</textPath>
    </text>
    <text font-family="Arial, Helvetica, sans-serif" font-size="6.5" letter-spacing="1.8" fill="#0B2A4A">
      <textPath href="#ypStampBotArc" startOffset="50%" text-anchor="middle">CERTIFIED · OFFICIAL DOCUMENT</textPath>
    </text>
  </g>
  <!-- Verification block -->
  <g transform="translate(112,16)">
    <text x="0" y="14" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="700" fill="#0B2A4A">DOCUMENT CERTIFIED</text>
    <line x1="0" y1="20" x2="96" y2="20" stroke="#22C55E" stroke-width="1.5"/>
    <text x="0" y="34" font-family="Arial, Helvetica, sans-serif" font-size="7.5" fill="#0B2A4A">Ref: <tspan id="ypStampRef" font-weight="700">YP-DOC-XXXX</tspan></text>
    <text x="0" y="46" font-family="Arial, Helvetica, sans-serif" font-size="7.5" fill="#0B2A4A">Issued: <tspan id="ypStampDate" font-weight="700">--</tspan></text>
    <text x="0" y="58" font-family="Arial, Helvetica, sans-serif" font-size="7.5" fill="#0B2A4A">Hash: <tspan id="ypStampHash" font-weight="700" font-size="6.5">--</tspan></text>
    <text x="0" y="72" font-family="Arial, Helvetica, sans-serif" font-size="6" fill="#0B2A4A" opacity="0.7">Verify at yunitepamoja.org</text>
  </g>
</svg>
