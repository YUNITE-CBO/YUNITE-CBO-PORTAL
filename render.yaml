# Render Blueprint - YUNITE Enterprise OS
# https://render.com/docs/blueprint-spec

services:
  - type: web
    name: yunite-enterprise-os
    runtime: node
    region: oregon
    plan: free
    # PDF generation uses pdfmake (pure JavaScript, server-side, no browser).
    # No Chromium download, no postinstall hook, no PUPPETEER_* env vars —
    # `npm ci && npm run build` is all that's needed.
    buildCommand: rm -rf .next && npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: RATE_LIMIT_WINDOW_MS
        value: "900000"
      - key: RATE_LIMIT_MAX_REQUESTS
        value: "100"
      # ===================================================================
      # SUPER ADMIN CONFIGURATION
      # ===================================================================
      # IMPORTANT: Set these environment variables in Render Dashboard
      # for production deployments. These values are NOT stored in
      # version control and must be configured per environment.
      #
      # Required environment variables for Super Admin bootstrapping:
      # - SUPER_ADMIN_NAME: Full name of the Super Administrator
      # - SUPER_ADMIN_EMAIL: Email address for login
      # - SUPER_ADMIN_PASSWORD: Secure password (min 8 chars with uppercase, lowercase, number)
      # - SUPER_ADMIN_PHONE: (optional) Phone number
      # - SUPER_ADMIN_STATUS: (optional) ACTIVE or INACTIVE, defaults to ACTIVE
      # ===================================================================
      - key: SUPER_ADMIN_NAME
        sync: false
      - key: SUPER_ADMIN_EMAIL
        sync: false
      - key: SUPER_ADMIN_PASSWORD
        sync: false
      - key: SUPER_ADMIN_PHONE
        sync: false
      - key: SUPER_ADMIN_STATUS
        value: "ACTIVE"
      # ===================================================================
      # END SUPER ADMIN CONFIGURATION
      # ===================================================================
      # ===================================================================
      # WORKFLOW & AUTOMATION ENGINE
      # ===================================================================
      # Shared secret protecting /api/cron/automation AND /api/cron/ai-investigations.
      # MUST match the CRON_SECRET on both cron services. Generate with:
      # openssl rand -hex 32
      # ===================================================================
      - key: CRON_SECRET
        sync: false
      # ===================================================================
      # AI INTELLIGENCE ENGINE
      # ===================================================================
      # Provider keys are SERVER-SIDE ONLY (never exposed to the browser).
      # The engine reads these via process.env at runtime. If a key is
      # unset the provider reports "not configured" and the failover /
      # deterministic-only paths take over (AI is an intelligence layer,
      # not a dependency for financial correctness).
      - key: AI_PROVIDER
        value: "gemini"
      - key: AI_DUAL_MODE
        value: "true"
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: "gemini-2.0-flash"
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_BASE_URL
        value: "https://openrouter.ai/api/v1"
      - key: OPENROUTER_MODEL
        sync: false
      # Failfast probe timeout (ms) for provider failure detection. Does NOT
      # cap the max generation duration — only how long we wait to decide a
      # provider is unreachable before falling over.
      - key: AI_FAILFAST_TIMEOUT_MS
        value: "1000"
      # Optional: member-lookup BFF base URL for display-layer verification.
      # When unset, member verification falls back to DB-vs-API comparison.
      - key: MEMBER_LOOKUP_VERIFY_URL
        sync: false
      - key: MEMBER_LOOKUP_VERIFY_SECRET
        sync: false

# Auto-deploy hook - configure in GitHub Secrets as RENDER_DEPLOY_HOOK_URL
# To get your deploy hook URL: Render Dashboard → Your Service → Settings → Deploy Hooks

# ===================================================================
# WORKFLOW & AUTOMATION ENGINE - cron ticker
# ===================================================================
# The automation engine (migration 025 + src/lib/services/automation) is
# event-driven for user actions but time-driven work (due schedules,
# weekly/monthly statements, overdue reminders, email retries) needs a
# clock. This cron service pokes the CRON_SECRET-protected endpoint every
# 5 minutes. Without it, processDueSchedules() and statement generation
# are dead code (they have no other caller).
#
# REQUIRED env var on the web service (set in Render Dashboard):
#   CRON_SECRET - any long random string. The cron command below must use
#                 the SAME value. Generate one with:
#                 openssl rand -hex 32
# ===================================================================
  - type: cron
    name: yunite-automation-tick
    runtime: node
    schedule: "*/5 * * * *"
    region: oregon
    plan: free
    buildCommand: 'true'   # nothing to build; curl is used at runtime
    startCommand: 'curl -fsS -m 120 -H "X-Cron-Secret: ${CRON_SECRET}" "${AUTOMATION_ENDPOINT}" || true'
    envVars:
      # The public URL of the yunite-enterprise-os web service + cron route.
      # Set AUTOMATION_ENDPOINT in Render Dashboard to:
      #   https://<your-render-web-service>.onrender.com/api/cron/automation
      # (Replace with your actual web service URL.)
      - key: AUTOMATION_ENDPOINT
        sync: false
      # MUST match the CRON_SECRET set on the yunite-enterprise-os web service.
      - key: CRON_SECRET
        sync: false

# ===================================================================
# AI INTELLIGENCE ENGINE - scheduled investigation cron ticker
# ===================================================================
# Pokes the CRON_SECRET-protected /api/cron/ai-investigations endpoint on a
# configurable schedule. Each tick reads due ai_investigation_schedules and
# runs them (dual-mode for full_system), alerting on CRITICAL findings. When
# both AI providers are unavailable, deterministic findings still run + alert.
# Default 30-min cadence is enough for daily/weekly schedules; bump to */5 for
# more responsive alerting. Configured schedules (not this interval) decide
# what actually runs each tick.
  - type: cron
    name: yunite-ai-investigations-tick
    runtime: node
    schedule: "*/30 * * * *"
    region: oregon
    plan: free
    buildCommand: 'true'
    startCommand: 'curl -fsS -m 600 -H "X-Cron-Secret: ${CRON_SECRET}" "${AI_INVESTIGATIONS_ENDPOINT}" || true'
    envVars:
      - key: AI_INVESTIGATIONS_ENDPOINT
        sync: false
      - key: CRON_SECRET
        sync: false

